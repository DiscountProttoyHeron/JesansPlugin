name: Build CloudStream Extensions

on:
  push:
    branches-ignore:
      - builds
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs3-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugins:
    name: Build & Publish .cs3 Plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build All Plugins (.cs3) & plugins.json
        run: |
          if [ -d "ExampleProvider" ]; then
            ./gradlew make makePluginsJson -x :ExampleProvider:make -x :ExampleProvider:compileDebugKotlin -x :ExampleProvider:compileReleaseKotlin --no-daemon
          else
            ./gradlew make makePluginsJson --no-daemon
          fi

      - name: Collect Multi-Plugin Artifacts & Verify SHA256
        run: |
          rm -rf /tmp/cs3_builds_out && mkdir -p /tmp/cs3_builds_out
          find . -maxdepth 3 -path "*/build/*.cs3" -exec cp -v {} /tmp/cs3_builds_out/ \;
          if [ -f build/plugins.json ]; then
            cp -v build/plugins.json /tmp/cs3_builds_out/plugins.json
          fi
          python3 -c '
          import json, hashlib, os
          out_dir = "/tmp/cs3_builds_out"
          p_file = os.path.join(out_dir, "plugins.json")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          if os.path.exists(p_file):
              data = json.load(open(p_file))
              for item in data:
                  internal = item.get("internalName", "")
                  cs3_path = os.path.join(out_dir, f"{internal}.cs3")
                  if os.path.exists(cs3_path):
                      item["sha256"] = hashlib.sha256(open(cs3_path, "rb").read()).hexdigest()
                      if repo:
                          item["url"] = f"https://raw.githubusercontent.com/{repo}/builds/{internal}.cs3"
              json.dump(data, open(p_file, "w"), indent=2)
          '
          ls -la /tmp/cs3_builds_out/

      - name: Publish Multi-Plugin Builds Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds_publish_tmp
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -v /tmp/cs3_builds_out/* .
          git add -A
          git commit -m "chore(builds): publish multi-plugin .cs3 artifacts & plugins.json"
          git push --force origin HEAD:builds
