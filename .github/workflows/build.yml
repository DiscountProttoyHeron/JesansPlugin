name: Build CloudStream Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugins and plugins.json
        run: ./gradlew make makePluginsJson --stacktrace

      - name: Prepare builds output
        run: |
          mkdir -p dist
          find . -name "*.cs3" -exec cp {} dist/ \;
          if [ -f "build/plugins.json" ]; then
            cp build/plugins.json dist/
          elif [ -f "plugins.json" ]; then
            cp plugins.json dist/
          fi
          ls -la dist/

      - name: Deploy to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          force_orphan: true
